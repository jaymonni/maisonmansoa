<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Espace privé — Maison Mansoa</title><style>body{margin:0;background:#fdfbf7;color:#24483b;font:16px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}main{box-sizing:border-box;width:min(440px,92vw);background:white;border:1px solid #e9dfd5;border-radius:18px;padding:32px;text-align:center;box-shadow:0 8px 30px #0001}h1{font:32px Georgia,serif}button{background:#24483b;color:white;border:0;border-radius:9px;padding:14px 20px;font:inherit;cursor:pointer;margin:8px}p{line-height:1.6}a{color:inherit}</style></head><body><main><h1>Maison Mansoa ♡</h1><h2>Espace privé</h2><p>Configuration de la connexion administrateur. La messagerie n'est pas encore accessible.</p><button id="login" disabled>Se connecter avec Google</button><button id="logout" hidden>Se déconnecter</button><p id="status" role="status">Chargement de Firebase…</p><a href="index.html">Retour à la boutique</a></main><script type="module">
const status=document.getElementById("status"),login=document.getElementById("login"),logout=document.getElementById("logout");
try{
 const {app}=await import("./js/firebase-config.js");
 const {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=await import("https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js");
 const auth=getAuth(app);
 onAuthStateChanged(auth,user=>{login.hidden=!!user;login.disabled=false;logout.hidden=!user;status.textContent=user?"Connexion Google réussie. Aucun droit administrateur ni accès aux messages n'est encore accordé.":"Connectez-vous avec votre compte Google.";});
 login.addEventListener("click",async()=>{login.disabled=true;try{const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});await signInWithPopup(auth,provider);}catch(e){status.textContent="Connexion impossible : "+(e.code||"erreur inconnue");}finally{login.disabled=false;}});
 logout.addEventListener("click",async()=>{try{await signOut(auth);}catch(e){status.textContent="Déconnexion impossible. Réessayez."; }});
}catch(e){status.textContent="Impossible de charger Firebase. Veuillez réessayer ultérieurement.";}
</script></body></html>
