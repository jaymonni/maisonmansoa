<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Messagerie privée — Maison Mansoa</title><style>
*{box-sizing:border-box}body{margin:0;background:#fdfbf7;color:#24483b;font:16px Arial,sans-serif}main{max-width:1000px;margin:30px auto;padding:20px}h1,h2{font-family:Georgia,serif}header,.panel{background:white;border:1px solid #e9dfd5;border-radius:16px;padding:22px;margin-bottom:16px}button{background:#24483b;color:white;border:0;border-radius:8px;padding:12px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:inherit}#inbox{display:grid;grid-template-columns: minmax(200px,1fr) minmax(0,2fr);gap:16px}[hidden]{display:none!important}#list{display:grid;gap:8px}#list button{text-align:left;overflow-wrap:anywhere}#messages{max-height:50vh;overflow:auto;display:grid;gap:10px}.message{background:#f6f0e8;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.message.admin{background:#e2eee7}textarea{width:100%;padding:12px;font:inherit;border:1px solid #aaa;border-radius:8px;margin:12px 0}#status,#replyStatus{line-height:1.5}@media(max-width:650px){#inbox{grid-template-columns:1fr}main{margin:0;padding:12px}}
.message small{display:block;font-size:11px;color:#555;margin-top:6px}.message{max-width:88%;justify-self:start}.message.admin{justify-self:end}header h1{margin:0 0 12px}header h2{margin:0 0 12px}#messages{min-height:100px}#list{max-height:45vh;overflow:auto}main{margin:12px auto;padding:12px}header,.panel{padding:16px;margin-bottom:8px}header h1{font-size:28px}header h2,.panel h2{font-size:22px;margin:8px 0 14px}#messages{max-height:40vh}#reply textarea{margin:6px 0;min-height:65px}#inbox{gap:10px;grid-template-columns:minmax(150px,1fr) minmax(0,2fr)}@media(max-width:650px){#inbox{grid-template-columns:1fr}#list{max-height:150px}}#list .conversation-button{display:flex;align-items:center;justify-content:space-between;gap:8px}.unread-dot{display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px;height:24px;border-radius:50%;background:#a94e37;color:white;font-size:13px;font-weight:bold}.tabs,#actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs button,#actions button{font-size:13px;padding:8px 10px}.tabs button[aria-pressed=false]{background:#eee;color:#24483b}#deleteConversation{background:#a94e37}#activeTab{display:flex;align-items:center;gap:6px}.unread-dot{min-width:24px;padding:0 5px;width:auto}</style></head><body><main><header><h1>Maison Mansoa ♡</h1><h2>Messagerie privée</h2><button id="login" disabled>Se connecter avec Google</button> <button id="logout" hidden>Se déconnecter</button><p id="status" role="status">Chargement…</p><a href="index.html">Retour à la boutique</a></header><section id="inbox" hidden><div class="panel"><h2>Conversations</h2><div class="tabs"><button id="activeTab" aria-pressed="true">Conversations <span id="totalUnread" class="unread-dot" hidden></span></button><button id="archiveTab" aria-pressed="false">Archives</button></div><div id="list"></div></div><div class="panel"><h2 id="title">Sélectionnez une conversation</h2><div id="actions" hidden><button id="archive">Archiver</button> <button id="deleteConversation">Supprimer</button></div><div id="messages" role="log"></div><form id="reply" hidden><label for="text">Votre réponse</label><textarea id="text" rows="4" maxlength="2000" required></textarea><button id="send">Envoyer</button></form><p id="replyStatus" role="status"></p></div></section></main><script type="module" src="js/admin-messages.js?v=5"></script></body></html>
